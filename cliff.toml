[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
body = """
{%- macro remote_url() -%}
  https://github.com/rossgroomio/fpl-cli
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"

commit_parsers = [
    { message = "^Merge ", skip = true },
    # Review-iteration commits from the cloud-PR era mislabelled as fix: —
    # internal PR churn, not user-facing changes (see CLAUDE.md "Commits & Changelog")
    { message = "^fix: apply code-review findings", skip = true },
    { message = "^fix: address PR review", skip = true },
    # Test-suite-internal fixes are not user-facing, same as the ^test skip below
    { message = "^fix\\(tests?\\)", skip = true },
    # One-off cloud-PR-era commits no prefix rule catches: a refactor that only
    # removed code added earlier in the same PR, and a shipped-data refresh that
    # landed without a conventional prefix
    { message = "^refactor: drop unreached has_strength_data guard", skip = true },
    { message = "^Update team_managers\\.yaml", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^perf", group = "Performance" },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^docs", skip = true },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
    { message = ".*", group = "Other" },
]
