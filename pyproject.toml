[project]
name = "fplkit"
dynamic = ["version"]
description = "CLI tool for Fantasy Premier League analysis - classic and draft formats"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ross Groom", email = "rossgroom1+tech@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "ruamel.yaml>=0.18.0",
    "keyring>=24.0.0",
    "platformdirs>=4.3,<5",
    "pulp>=2.7,<4",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
scraper = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-socket>=0.7.0",
    "respx>=0.21.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/rossgroomio/fpl-cli"
Repository = "https://github.com/rossgroomio/fpl-cli"

[project.scripts]
fpl = "fpl_cli.cli:main"

[build-system]
requires = ["hatchling>=1.21", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "fpl_cli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["fpl_cli"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ANN", "BLE001", "E", "F", "I", "N", "TID", "W"]
# ANN401 is the one annotation rule left off (#193): a bare `Any` is the honest
# type at the JSON/YAML boundary, on decorator pass-throughs (*args/**kwargs)
# and on duck-typed player objects, so the rule fights legitimate code more than
# it catches missing hints. Prefer the real type wherever one exists.
ignore = ["ANN401"]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports everywhere (#193). The default only bans `from ..parent`,
# which is how a dozen sibling `from ._models import ...` lines survived in api/providers.
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Both halves of #219: main() merges the settings once and puts them on the
# Click context, and a command reaching around that is how the same isinstance
# dance ended up written out six times across five commands while ten more
# re-loaded the settings from scratch.
"fpl_cli.cli._context.CLIContext".msg = "Read the Click context through get_format()/get_settings()/custom_analysis_enabled() instead of unwrapping ctx.obj."
"fpl_cli.cli._context.load_settings".msg = "Use get_settings(ctx) — main() already merged the settings onto the context. load_settings() is for callers with no context."

[tool.ruff.lint.per-file-ignores]
# Prompts are long strings - line length doesn't apply
"fpl_cli/prompts/*.py" = ["E501"]
# The entry point is what puts CLIContext and the settings on the context
"fpl_cli/cli/__init__.py" = ["TID251"]
# `fpl doctor` runs on an empty CLIContext on purpose so each check can re-read
# the settings itself as it goes (see main())
"fpl_cli/cli/doctor.py" = ["TID251"]
# Agents and services have no Click context to read
"fpl_cli/agents/**/*.py" = ["TID251"]
# Test files tolerate long lines (fixture dicts, patch chains) and terse loop
# vars, construct CLIContext to stand in for the group callback, and skip the
# annotation rules: thousands of `def test_*` signatures with no type-safety
# payoff (#193)
"tests/**/*.py" = ["ANN", "E501", "E741", "TID251"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Hermeticity guard (#53): any test that opens a socket fails at the time it
# is written, instead of silently depending on live endpoints. The unix-socket
# allowance is required — asyncio's event loop self-pipe uses socketpair().
# A test that genuinely needs a socket opts out with @pytest.mark.enable_socket.
addopts = "--disable-socket --allow-unix-socket"
filterwarnings = [
    # Diagnostic, not a gate: leaked transports/sockets surface in the warning
    # summary instead of being hidden by the default ResourceWarning filter.
    # GC timing makes the signal nondeterministic, so the guard above is what
    # actually fails a leaking test.
    "always::ResourceWarning",
]
