name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: pip install hatch && hatch build

      - name: Version guard
        run: |
          for f in dist/*; do
            if echo "$f" | grep -qE '0\.0\.0|\.dev'; then
              echo "::error::Bad version in $f - check tag format (needs v prefix) and fetch-depth"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # v1.14.2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          print-hash: true

  changelog:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The main ruleset blocks direct pushes, and the github-actions app
          # can't be added to its bypass list - so push as the repo admin
          # (fine-grained PAT, Contents: read/write), who is a bypass actor.
          # Falls back to GITHUB_TOKEN if the secret is unset.
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Install git-cliff
        run: pip install git-cliff

      - name: Generate changelog
        run: git-cliff --latest --prepend CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: update CHANGELOG.md [skip ci]"
          # Non-fast-forward risk: if main advances in the ~30s between tag push and here,
          # this push fails. Acceptable for a solo project - re-run the job manually if needed.
          git push origin HEAD:main
