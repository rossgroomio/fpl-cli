# Copy to your config directory as settings.yaml (or run: fpl init)

fpl:
  classic_entry_id: 0
  draft_league_id: 0
  draft_entry_id: 0
  classic_league_id: 0

# Reports land in a season subdirectory of these — ~/fpl-reports/2026-27/gw21-review.md.
# The season segment is appended for you; don't put it here. It is what stops a new
# season's GW21 report overwriting the previous season's (filenames carry no season).
reports:
  output_dir: "~/fpl-reports"
  research_dir: "~/fpl-research"

# LLM providers: configure per role (research + synthesis)
# Env var overrides: FPL_RESEARCH_PROVIDER, FPL_RESEARCH_MODEL, FPL_SYNTHESIS_PROVIDER, etc.
#
# llm:
#   research:
#     provider: perplexity          # perplexity | anthropic | openai
#     model: sonar-pro
#   synthesis:
#     provider: anthropic
#     model: claude-sonnet-5
#
# Switch synthesis to OpenAI:
#   synthesis:
#     provider: openai
#     model: gpt-4o
#
# Use a local Ollama instance:
#   synthesis:
#     provider: openai
#     model: llama3
#     base_url: http://localhost:11434/v1
#     timeout: 30
