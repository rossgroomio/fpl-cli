# Project defaults — committed, no personal data.
# User overrides: settings.yaml in your config directory (see FPL_CLI_CONFIG_DIR)

use_net_points: false  # Include transfer hits in gameweek points rankings (classic only; affects league, review, fines)
custom_analysis: false  # Enable custom scoring algorithms (captain, targets, value scores, Bayesian FDR, etc.)
rolling_window: 5  # Number of qualifying fixtures for rolling_pts_per_m (3-10)

data_sources:
  cache_ttl: 3600
  rate_limit: 30

thresholds:
  transfer_xg_threshold: 0.15
  price_alert_threshold: 1
  differential_threshold: 5.0
  semi_differential_threshold: 15.0
  captain_differential_threshold: 10.0

# Injury returnee radar (`fpl returnees`). Tuning knobs — the right values are
# only knowable from real watchlists, so they live here rather than in code.
# The two quality bars are source-aware because a player who missed most of
# last season through injury cannot be prior-sourced: `generate_player_prior`
# only assigns source "history" at 450+ minutes, and the "price" fallback caps
# prior_strength at 0.5, so one flat threshold would exclude exactly the
# population this radar exists to surface.
returnee_radar:
  window_gameweeks: 6  # Keep a returnee whose expected return lands in the next N gameweeks
  stash_window_gameweeks: 2  # Escalate from watch to stash inside this shorter window
  history_watchlist_strength: 0.75  # prior_strength bar for a history-sourced player (0-1)
  history_stash_strength: 0.85  # prior_strength bar to escalate a history-sourced player
  price_watchlist_percentile: 0.80  # Bar for a price-sourced player: last healthy season's quality (0-1 of the position ceiling), or the within-position price percentile when no such season exists
  price_stash_percentile: 0.90  # Same measure, escalation bar
  stash_upgrade_margin: 5.0  # Quality points (0-100 scale) a returnee must beat the incumbent by
  enrich_stale_news_days: 7  # With --enrich, re-check a dated player whose FPL news is at least this old
  enrich_max_players: 8  # With --enrich, the most players one run will search for return intel
  enrich_concurrency: 4  # With --enrich, the most searches in flight at once
  enrich_query_spacing_seconds: 1.0  # With --enrich, the least time between two search starts (a per-minute quota counts starts, not searches in flight)

llm:
  research:
    provider: perplexity
    model: sonar-pro
    timeout: 120
    query_defaults:
      search_recency_filter: week
  synthesis:
    provider: anthropic
    model: claude-sonnet-5
    timeout: 60
    query_defaults:
      max_tokens: 4096

# Fines: opt-in via settings.yaml or `fpl init`. Example config:
#
# fines:
#   escalation_note: "Fines double each GW if not honoured"
#   classic:
#     - type: last-place           # Fine if you finish last in the GW
#       penalty: "Pint on video"   # Custom consequence text
#     - type: below-threshold      # Fine if you score below a points threshold
#       threshold: 25
#       penalty: "Pint on video"
#     - type: red-card             # Fine if a starter gets a red card
#       penalty: "Pint on video"
#   draft:
#     - type: last-place
#     - type: below-threshold      # Fine if you score below a points threshold
#       threshold: 25              # Required for below-threshold
#       penalty: "Pint on video"
#
# Valid rule types: last-place, red-card, below-threshold
# Valid keys under 'fines': classic, draft, escalation_note - a misspelled one is
# refused by name rather than ignored, since an ignored key silently disables the
# rules under it. 'threshold' must be an unquoted number.
# Net points (transfer hits) controlled by top-level use_net_points setting
